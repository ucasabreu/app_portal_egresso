name: Validar demonstração

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testar backend com banco isolado
        working-directory: backend
        run: bash ./mvnw -B test
      - name: Testar inicializadores
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validar frontend
        working-directory: frontend
        run: |
          npm ci --include=optional
          npm run lint
          npm test
          npm run build
      - name: Iniciar demonstração com PostgreSQL
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Validar funcionalidades pelo frontend e proxy
        run: python3 scripts/smoke_demo.py
      - name: Confirmar preservação dos dados ao reiniciar
        run: |
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 240
          python3 scripts/smoke_demo.py
      - name: Coletar logs
        if: always()
        run: docker compose logs --no-color > demo.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-logs
          path: demo.log
      - name: Encerrar ambiente de CI
        if: always()
        run: docker compose down --volumes
