# Credenciais públicas exclusivas do banco fictício de demonstração.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portal_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portal_demo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:portal_demo}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
