spring.application.name=egresso
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portal_egressos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Session cookies are isolated from other localhost projects; use HTTPS + secure cookies when hosting.
server.servlet.session.cookie.name=PORTAL_EGRESSOS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PORTAL_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.jpa.hibernate.ddl-auto=${PORTAL_SCHEMA_MODE:update}
spring.jpa.open-in-view=false
